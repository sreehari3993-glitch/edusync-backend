# Server
server.port=8081

# Frontend HTML served by Spring Boot at / and /college-platform-connected.html
edusync.frontend.html-path=classpath:/static/index.html

# ─── MySQL Database ───
spring.datasource.url=jdbc:mysql://localhost:3306/edusync_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=sreehari_99
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ───
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── JWT Secret ───
edusync.jwt.secret=EduSync_TKMIT_SecretKey_2025_CollegeDigitalPlatform_SuperSecure
edusync.jwt.expiration=86400000

# ─── File Upload ───
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
edusync.upload.dir=uploads/

# ─── CORS ───
edusync.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500,http://localhost:8081,http://127.0.0.1:8081,http://localhost:63342,http://127.0.0.1:63342,http://localhost:63343,http://127.0.0.1:63343,http://localhost:5173,http://127.0.0.1:5173

# ─── Logging ───
logging.level.com.edusync=DEBUG
logging.level.org.springframework.security=INFO
